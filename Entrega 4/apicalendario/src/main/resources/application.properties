spring.application.name=apicalendario

# Conexion a la base de datos PostgreSQL (DDL - Calendario Laboral.sql)
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/calendariolaboral
spring.datasource.username=postgres
spring.datasource.password=sa

# Las tablas las crea el DDL, JPA no las modifica
spring.jpa.hibernate.ddl-auto=none

# URL de la API Festivos (ExpressJS + MongoDB - Entrega 3)
festivos.url=http://localhost:3030/api/festivos
